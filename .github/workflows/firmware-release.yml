name: Firmware release

# Pushing a tag vX.Y.Z, or pushing a commit to the "firmware-release"
# branch (the tag is then created from kFirmwareVersion), builds the firmware WITHOUT the proprietary Si4684
# images (sdkconfig.release) and publishes digiradio.bin as a GitHub
# release. The radio reads the images from its flash store, filled once by
# a full build (0.11.1 or later) flashed from a developer machine. The
# igiRadio app downloads the release and uploads it over Wi-Fi.

on:
  push:
    tags: ["v*"]
    branches: ["firmware-release"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.3.5  # same ESP-IDF as the Mac builds running on the radio
    defaults:
      run:
        shell: bash
        working-directory: Software
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*kFirmwareVersion\[\] = "\([^"]*\)".*/\1/p' components/net/src/SetupWebServer.cpp)
          [ -n "$version" ] || { echo "kFirmwareVersion not found"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} != kFirmwareVersion ${version}"; exit 1
          fi
          # Never overwrite a published release: bump kFirmwareVersion instead.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/v${version}")
          [ "$code" = "404" ] || { echo "release v${version} already exists (HTTP $code)"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build without Si4684 images
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" build

      - name: Refuse an image that embeds Si4684 code
        run: |
          . "$IDF_PATH/export.sh"
          if xtensa-esp32s3-elf-nm build/digiradio.elf | grep -E "_binary_(rom_patch|dab_firmware|fm_firmware)"; then
            echo "Si4684 images are linked in: not publishable"; exit 1
          fi

      - name: Package
        run: |
          mkdir -p ../release
          cp build/digiradio.bin ../release/digiradio.bin
          cd ../release
          sha256sum digiradio.bin | cut -d' ' -f1 > digiradio.bin.sha256
          size=$(stat -c %s digiradio.bin)
          printf '{"version":"%s","size":%s,"sha256":"%s","needs_si4684_store":true}\n' \
            "$VERSION" "$size" "$(cat digiradio.bin.sha256)" > release.json
          cat release.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Firmware ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            release/digiradio.bin
            release/digiradio.bin.sha256
            release/release.json
          body: >-
            Firmware ${{ env.VERSION }} for DigiRadio. Install it from the
            igiRadio app (Settings › Firmware › Check for updates). Requires
            a radio that has run 0.11.1 or later at least once.
